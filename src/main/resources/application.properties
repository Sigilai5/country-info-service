spring.application.name=country-info-service
server.port=${SERVER_PORT:8080}

# MySQL (defaults match the local Docker container; override via env vars in Kubernetes)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/countrydb}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Connection pool sized for one pod; scale out with more replicas rather than bigger pools
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Database timeouts: no DB call may hang a request thread. Any of these surfaces as a
# DatabaseTimeoutException / 503 + Retry-After (see GlobalExceptionHandler).
#   wait for a free pooled connection
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}
#   connection health check
spring.datasource.hikari.validation-timeout=2000
#   TCP connect to MySQL, and last-resort socket read timeout if MySQL stops responding
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_CONNECT_TIMEOUT_MS:3000}
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_MS:15000}
#   wait for a row lock held by another transaction (MySQL default is 50s)
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=${DB_LOCK_WAIT_TIMEOUT_S:5}
#   each JPA query
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:5000}
#   whole transaction; Hibernate also applies the remaining time to every SQL statement in it
spring.transaction.default-timeout=${DB_TRANSACTION_TIMEOUT:10s}

# Actuator: health (with liveness/readiness probes), info, metrics, prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Logging (pattern, masking and appenders live in logback-spring.xml)
logging.level.com.ncba.countryinfo=${APP_LOG_LEVEL:INFO}
logging.file.path=${LOG_PATH:/tmp/logs}
# SQL errors are already logged (with the SQL message and stack trace) by RepositoryLoggingAspect and
# GlobalExceptionHandler; Hibernate's own copies (old and Hibernate 7 logger names) would duplicate them
# and log handled duplicate-key races as errors
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

# Resolve the real client IP from X-Forwarded-For when behind a trusted proxy/ingress
server.forward-headers-strategy=native

# Java 21 virtual threads: each request gets a cheap virtual thread, so blocking JPA/SOAP calls
# scale to high concurrency without a reactive stack
spring.threads.virtual.enabled=true

# OpenAPI / Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CountryInfoService SOAP API
soap.country-info.url=${SOAP_COUNTRY_INFO_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
soap.country-info.connect-timeout=${SOAP_CONNECT_TIMEOUT:3s}
soap.country-info.read-timeout=${SOAP_READ_TIMEOUT:5s}

# Aspect order: CircuitBreaker(outer) -> Retry(inner) -> SOAP call. Each request gets up to 3 attempts;
# the breaker records one failure per request after retries are exhausted, and skips retries when open.
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

# Retry transient SOAP failures (I/O errors, timeouts, HTTP errors, SOAP faults, non-XML error pages from
# a gateway): 3 attempts, 500ms then 1s backoff. Not-found answers are never retried.
resilience4j.retry.instances.countryInfoSoap.max-attempts=3
resilience4j.retry.instances.countryInfoSoap.wait-duration=500ms
resilience4j.retry.instances.countryInfoSoap.enable-exponential-backoff=true
resilience4j.retry.instances.countryInfoSoap.exponential-backoff-multiplier=2
resilience4j.retry.instances.countryInfoSoap.retry-exceptions=org.springframework.ws.client.WebServiceIOException,org.springframework.ws.client.WebServiceTransportException,org.springframework.ws.soap.client.SoapFaultClientException,org.springframework.ws.InvalidXmlException
resilience4j.retry.instances.countryInfoSoap.ignore-exceptions=com.ncba.countryinfo.exception.CountryNotFoundException

# Circuit breaker: open when >=50% of the last 10 calls fail (min 5 calls); stay open 30s, then probe with 3 calls.
resilience4j.circuitbreaker.instances.countryInfoSoap.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.countryInfoSoap.sliding-window-size=10
resilience4j.circuitbreaker.instances.countryInfoSoap.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.countryInfoSoap.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.countryInfoSoap.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.countryInfoSoap.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.countryInfoSoap.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.countryInfoSoap.ignore-exceptions=com.ncba.countryinfo.exception.CountryNotFoundException

# In-memory cache for ISO codes and full country info (static reference data): max 1000 entries each,
# refreshed daily
spring.cache.type=caffeine
spring.cache.cache-names=isoCodes,countryInfo
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h,recordStats

# Pagination: default 20 per page, never more than 100 (protects the DB from huge pages)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Load the languages of a whole page of countries in one query instead of one per country (avoids N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Graceful shutdown: on SIGTERM (pod termination) stop accepting requests and let in-flight ones
# finish (up to 30s, within the pod's 45s terminationGracePeriodSeconds)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
